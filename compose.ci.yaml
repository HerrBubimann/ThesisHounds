# CI ONLY: replaces the real Ollama service with a deterministic mock so the full
# stack can be smoke-tested without models, GPU or internet access.
# Usage: docker compose -f compose.yaml -f compose.ci.yaml up -d --no-build --wait
# Requires the backend image (built from compose.yaml) and the synthetic fixtures in tests/.
services:
  ollama:
    image: thesishounds/backend:0.2.0
    build: !reset null
    command: ["python", "-m", "tests.fixtures.mock_ollama"]
    cpus: 1.0
    mem_limit: 512m
    environment: !override
      PYTHONDONTWRITEBYTECODE: "1"
      CONFIG_DIR: /app/config
    volumes: !override
      - ./tests:/app/tests:ro
    tmpfs: !override
      - /tmp:rw,noexec,nosuid,size=16m,uid=10001,gid=10001,mode=1770
    healthcheck: !override
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:11434/api/tags', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
