[theme]
base = "light"
primaryColor = "#9F2338"
backgroundColor = "#F6F7F9"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#202735"
font = "Arial, sans-serif"
headingFont = "Arial, sans-serif"
codeFont = "monospace"

[theme.sidebar]
backgroundColor = "#202735"
secondaryBackgroundColor = "#303B4D"
textColor = "#F8FAFC"
primaryColor = "#9F2338"

[browser]
gatherUsageStats = false
serverAddress = "localhost"
serverPort = 8501

[server]
headless = true
enableCORS = true
enableXsrfProtection = true
fileWatcherType = "none"
maxUploadSize = 20

[client]
showErrorDetails = "none"
toolbarMode = "minimal"
