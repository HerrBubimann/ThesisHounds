name: Setup Python with locked dependencies
description: Installs CPython and the hash-locked development dependencies (pip cache enabled).

inputs:
  python-version:
    description: Exact CPython version, identical to the Docker images.
    default: "3.12.16"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: requirements-dev.lock
    - name: Install locked dependencies (hash-verified)
      shell: bash
      run: python -m pip install --require-hashes -r requirements-dev.lock
